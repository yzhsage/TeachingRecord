name: Sync national holidays

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "sync-national-holidays"
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and generate holiday data
        run: node scripts/sync-holidays.mjs
      - name: Commit changed data
        run: |
          if git diff --quiet -- public/calendar/national-holidays.json; then
            echo "No holiday changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/calendar/national-holidays.json
          git commit -m "chore: sync national holidays"
          git push
